# COM-4/COM-7 installers (docs/INSTALLERS.md):
#   windows: Release UI build (MSVC, static CRT) + sonora_tests, then Inno Setup -> Sonora-<v>-windows-x64-setup.exe
#   linux:   ci/linux/Dockerfile, Release UI build -> Sonora-<v>-x86_64.AppImage + sonora_<v>_amd64.deb
#   macos:   Release app (arm64), ad hoc signed -> Sonora-<v>.dmg, plus the VST3 installers. On a tag it also makes the
#            Sparkle update (COM-4b, docs/UPDATES.md "Releases from CI"): Sonora-<v>.zip, deltas and appcast.xml, signed
#            with the SPARKLE_ED_PRIVATE_KEY secret; the app carries packaging/macos/updates.env (feed + public key).
#            Plus the VST3 installers
#            Sonora-Prism-VST3-<v>.pkg (PLG-11c), Sonora-Curve-LFO-VST3-<v>.pkg (PLG-12b) and Sonora-Hush-VST3-<v>.pkg (PLG-14). Not
#            Developer ID signed or notarized yet (COM-4b). Off by default for manual runs (macOS minutes cost 10x).
# A v* tag builds all three and attaches them to a draft GitHub Release; nothing is published automatically.
# The tag must equal project() in CMakeLists.txt (the version About shows), and the release must carry every file the
# website links to (site/*.html releases/latest/download/<name>). docs/INSTALLERS.md "Release checks".
# Manual runs (workflow_dispatch) work once this file is on the default branch.
name: installers

on:
  push:
    tags: ["v*"]
  # Pull requests that touch packaging build the Windows and Linux installers (no macOS, no release).
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/installers.yml"
      - "ci/linux/**"
      - "cmake/**"
      - "CMakeLists.txt"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (empty = project version from CMakeLists.txt)"
        required: false
        default: ""
      macos:
        description: "Also build the macOS disk image"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          project="$(sed -nE 's/^project\(Sonora VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"
          else v="$project"; fi
          [[ "$v" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "bad version '$v'"; exit 1; }
          # A release whose tag differs from project() would leave developer builds showing an old version in About.
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "$v" != "$project" ]; then
            echo "::error::tag $GITHUB_REF_NAME but CMakeLists.txt says project(Sonora VERSION $project): bump it first (docs/INSTALLERS.md "Release checks")"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Release is ready (version, every plug-in packaged and on the website)
        if: github.ref_type == 'tag'
        run: scripts/release/check_release_ready.sh "${GITHUB_REF_NAME#v}"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Keep LF: bash scripts and byte-exact test fixtures break with the runner's default autocrlf=true.
      - name: Disable CRLF conversion
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch JUCE and Skia
        shell: bash
        run: scripts/bootstrap.sh

      # COM-4l: a tag builds the WinSparkle updater with the feed and public key; other runs have updates off.
      - name: Configure (Release, UI)
        shell: bash
        run: |
          updates=()
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            . packaging/macos/updates.env
            updates=(-DSONORA_UPDATE_FEED_URL="$SONORA_UPDATE_FEED_URL_WINDOWS" -DSONORA_UPDATE_PUBLIC_KEY="$SONORA_UPDATE_PUBLIC_KEY")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSONORA_WITH_UI=ON -DSONORA_APP_VERSION="$VERSION" "${updates[@]}"

      # -k 0: report every compile error of a run, not only the first one.
      - name: Build
        run: cmake --build build -- -k 0

      - name: Run sonora_tests
        shell: bash
        run: |
          set -o pipefail
          build/tests/sonora_tests.exe | tee build/tests.log
          grep -q " 0 failed checks" build/tests.log

      - name: Installer (Inno Setup)
        shell: bash
        run: |
          set -euo pipefail
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || { choco install innosetup -y --no-progress; }
          app="$(dirname "$(find build/src/Sonora_artefacts -name Sonora.exe | head -1)")"
          ls -la "$app" "$app/Resources"
          # The installer ships the two executables and WinSparkle.dll (COM-4l): none may need OpenSSL or the VC++
          # runtime DLLs, which are on this runner's PATH but not on a user's machine (0.1.1 asked for libcrypto-3-x64.dll).
          [ -f "$app/WinSparkle.dll" ] || { echo "::error::WinSparkle.dll is missing next to Sonora.exe (scripts/bootstrap.sh)"; exit 1; }
          for exe in "$app/Sonora.exe" "$app/sonora_plugin_scanner.exe" "$app/WinSparkle.dll"; do
            deps="$(dumpbin -nologo -dependents "$(cygpath -w "$exe")")"
            echo "$deps"
            if echo "$deps" | grep -iE "libcrypto|libssl|vcruntime|msvcp|ucrtbased"; then
              echo "::error::$exe depends on a DLL the installer does not ship"; exit 1
            fi
          done
          icon="$(find build/src -name icon.ico | head -1)"
          args=("/DAppVersion=$VERSION" "/DSourceDir=$(cygpath -w "$PWD/$app")" "/DOutputDir=$(cygpath -w "$PWD/dist/windows")")
          [ -n "$icon" ] && args+=("/DIconFile=$(cygpath -w "$PWD/$icon")")
          # Git Bash rewrites arguments that start with "/" into Windows paths; ISCC's /D switches must reach it as is.
          MSYS2_ARG_CONV_EXCL='*' "$iscc" "${args[@]}" packaging/windows/sonora.iss
          (cd dist/windows && sha256sum *.exe > "Sonora-$VERSION-windows.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/windows/*
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-logs
          path: build/tests.log
          if-no-files-found: ignore

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build the container
        run: docker build -t sonora-linux ci/linux

      # COM-4l: a tag builds the Linux updater with the feed and public key; other runs have updates off.
      - name: Release build + AppImage + .deb
        run: |
          feed="" key=""
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            . packaging/macos/updates.env
            feed="$SONORA_UPDATE_FEED_URL_LINUX" key="$SONORA_UPDATE_PUBLIC_KEY"
          fi
          docker run --rm -v "$PWD":/src -w /src \
            -e SONORA_THIRD_PARTY_DIR=/src/third_party \
            -e SONORA_BUILD_ROOT=/src \
            -e SONORA_JOBS=4 \
            -e SONORA_APP_VERSION="${{ needs.version.outputs.version }}" \
            -e SONORA_UPDATE_FEED_URL="$feed" -e SONORA_UPDATE_PUBLIC_KEY="$key" \
            sonora-linux ci/linux/build.sh package

      - name: Install the .deb and start the app on a clean Ubuntu
        run: |
          docker run --rm -v "$PWD/dist/linux":/dist ubuntu:24.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/sonora_*_amd64.deb xvfb xauth >/dev/null
            test -x /opt/sonora/Sonora -a -x /opt/sonora/sonora_plugin_scanner
            set +e; timeout 20 xvfb-run -a sonora; code=$?; set -e
            echo "sonora exited with $code after the timeout (124 = still running, expected)"
            [ "$code" = 124 ]'

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/linux/*
          if-no-files-found: error

  macos:
    needs: version
    if: github.ref_type == 'tag' || inputs.macos
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE, Skia and Sparkle
        run: scripts/bootstrap.sh

      # A tag is a release users install, so it must update itself: a build without the feed could never be updated
      # again. Other runs (and forks, which have no secret) build with updates off.
      - name: Updates for this build
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            . packaging/macos/updates.env
            [ -n "$SONORA_UPDATE_PUBLIC_KEY" ] || { echo "::error::packaging/macos/updates.env has no SONORA_UPDATE_PUBLIC_KEY"; exit 1; }
            { echo "SONORA_UPDATE_FEED_URL=$SONORA_UPDATE_FEED_URL"; echo "SONORA_UPDATE_PUBLIC_KEY=$SONORA_UPDATE_PUBLIC_KEY"; } >> "$GITHUB_ENV"
            echo "updates on: $SONORA_UPDATE_FEED_URL"
          elif [ "${GITHUB_REF_TYPE}" = tag ] && [ "$GITHUB_REPOSITORY" = lordillusions/sonora ]; then
            echo "::error::the SPARKLE_ED_PRIVATE_KEY secret is missing: a release without it never updates (docs/UPDATES.md)"
            exit 1
          else
            echo "updates off in this build (not a tag, or no SPARKLE_ED_PRIVATE_KEY secret)"
          fi

      - name: Release build
        run: |
          cmake -S . -B build-release-app -G Ninja -DCMAKE_BUILD_TYPE=Release -DSONORA_APP_VERSION="$VERSION" -DSONORA_BUILD_TESTS=OFF \
              -DSONORA_UPDATE_FEED_URL="${SONORA_UPDATE_FEED_URL:-}" -DSONORA_UPDATE_PUBLIC_KEY="${SONORA_UPDATE_PUBLIC_KEY:-}"
          cmake --build build-release-app --target Sonora SonoraPrism_VST3 SonoraCurveLfo_VST3 SonoraHush_VST3

      - name: Disk image (ad hoc signed, not notarized)
        if: env.SONORA_UPDATE_FEED_URL == ''
        run: |
          app=build-release-app/src/Sonora_artefacts/Release/Sonora.app
          codesign --force --sign - "$app/Contents/MacOS/sonora_plugin_scanner"
          codesign --force --sign - "$app"
          packaging/macos/make_dmg.sh "$app" "dist/macos/Sonora-$VERSION.dmg"
          (cd dist/macos && shasum -a 256 *.dmg > "Sonora-$VERSION-macos.sha256")

      # make_release.sh signs the app the same way, makes the dmg, the update zip, deltas from the latest releases in
      # the live feed, and the new appcast.xml. The appcast goes live when the website is synced (docs/RELEASING.md 8).
      - name: Disk image and update (ad hoc signed, not notarized)
        if: env.SONORA_UPDATE_FEED_URL != ''
        run: |
          key="$RUNNER_TEMP/sparkle_ed.key"
          (umask 077 && printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key")
          printf '<p>Sonora %s. <a href="https://github.com/%s/releases/tag/v%s">What is new in this version</a>.</p>\n' \
              "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" > "$RUNNER_TEMP/notes.html"
          status=0
          scripts/release/make_release.sh --app build-release-app/src/Sonora_artefacts/Release/Sonora.app \
              --version "$VERSION" --feed-url "$SONORA_UPDATE_FEED_URL" --public-key "$SONORA_UPDATE_PUBLIC_KEY" \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
              --previous-feed "$SONORA_UPDATE_FEED_URL" --archives dist/updates --ed-key-file "$key" \
              --notes "$RUNNER_TEMP/notes.html" --product-link https://sonoradaw.com/download.html || status=$?
          rm -f "$key"
          [ "$status" = 0 ] || exit "$status"
          mkdir -p dist/macos
          mv "dist/installers/Sonora-$VERSION.dmg" dist/macos/
          (cd dist/macos && shasum -a 256 *.dmg > "Sonora-$VERSION-macos.sha256")
          # The update files: the zip, its deltas and their checksums (make_release.sh lists them), and the new feed.
          for f in $(awk '{ print $2 }' "dist/updates/Sonora-$VERSION.sha256"); do cp "dist/updates/$f" dist/macos/; done
          cp "dist/updates/Sonora-$VERSION.sha256" "dist/macos/Sonora-$VERSION-update.sha256"
          cp dist/updates/appcast.xml dist/macos/appcast.xml
          ls -l dist/macos

      - name: VST3 installer package (unsigned, not notarized)
        run: |
          packaging/macos/make_vst3_pkg.sh "build-release-app/src/SonoraPrism_artefacts/Release/VST3/Sonora Prism.vst3" \
              "dist/macos/Sonora-Prism-VST3-$VERSION.pkg"
          packaging/macos/make_vst3_pkg.sh "build-release-app/src/SonoraCurveLfo_artefacts/Release/VST3/Sonora Curve LFO.vst3" \
              "dist/macos/Sonora-Curve-LFO-VST3-$VERSION.pkg"
          packaging/macos/make_vst3_pkg.sh "build-release-app/src/SonoraHush_artefacts/Release/VST3/Sonora Hush.vst3" \
              "dist/macos/Sonora-Hush-VST3-$VERSION.pkg"
          # Every bundle must say the release's version (the plug-ins' own About/host info).
          for b in build-release-app/src/*_artefacts/Release/VST3/*.vst3 build-release-app/src/Sonora_artefacts/Release/Sonora.app; do
            v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$b/Contents/Info.plist")"
            echo "$b: $v"
            [ "$v" = "$VERSION" ] || { echo "::error::$b says $v, expected $VERSION"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/macos/*
          if-no-files-found: error

  release:
    needs: [version, windows, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      # sonoradaw.com links to this release's versioned files (set_version_links.py); older pages and READMEs link
      # releases/latest/download/<stable name>, so every release also carries version-free copies.
      - name: Stable download names for the website
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          cp "Sonora-$VERSION.dmg" Sonora-macOS.dmg
          cp "Sonora-Prism-VST3-$VERSION.pkg" Sonora-Prism-VST3-macOS.pkg
          cp "Sonora-Curve-LFO-VST3-$VERSION.pkg" Sonora-Curve-LFO-VST3-macOS.pkg
          cp "Sonora-Hush-VST3-$VERSION.pkg" Sonora-Hush-VST3-macOS.pkg
          cp "Sonora-$VERSION-windows-x64-setup.exe" Sonora-Windows-x64-setup.exe
          cp "Sonora-$VERSION-x86_64.AppImage" Sonora-Linux-x86_64.AppImage
          cp "sonora_${VERSION}_amd64.deb" Sonora-Linux-amd64.deb
      # COM-4l: appcast-windows.xml (WinSparkle) and appcast-linux.xml (AppImage + .deb), signed with the macOS key.
      # The script checks every signature against updates.env's public key, so a mismatched secret fails here.
      - name: Update feeds for Windows and Linux
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::the SPARKLE_ED_PRIVATE_KEY secret is missing"; exit 1; }
          . src/packaging/macos/updates.env
          key="$RUNNER_TEMP/sparkle_ed.key"
          (umask 077 && printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key")
          status=0
          python3 -I src/scripts/release/write_platform_feeds.py --version "$VERSION" --dist dist --key-file "$key" \
              --public-key "$SONORA_UPDATE_PUBLIC_KEY" --repo "$GITHUB_REPOSITORY" || status=$?
          rm -f "$key"
          exit "$status"
      # The website's download buttons must never point at a file the release lacks (a 404 for a visitor).
      - name: Every file the website links to is in this release
        run: |
          missing=0
          for name in $(grep -ohE 'releases/(latest/download|download/v[0-9.]+)/[^"]*' src/site/*.html | sed 's|.*/||' | sort -u); do
            if [ -f "dist/$name" ]; then echo "ok $name ($(stat -c %s "dist/$name") bytes)"
            else echo "::error::site links to $name but the release has no such file"; missing=1; fi
          done
          [ "$missing" = 0 ]
      - name: Draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Sonora ${{ needs.version.outputs.version }}" \
            --notes "Installers for macOS (arm64), Windows x64 and Linux x64. Draft: review before publishing."
